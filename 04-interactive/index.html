// ===== 筛选辅助 =====
function inCore(nid){ const n = nodeById[nid]; return n && (n.priority === 'P0' || n.priority === 'P1'); }
function edgeVisible(e){
  if (currentView === 'full') return true;
  if (currentView === 'sprint') return inCore(e.from) && inCore(e.to);
  return true;
}

// ===== 组级视图 =====
function buildGroupNodes(){
  let gids = DATA.groups.map(g => g.id);
  if (domainFilter) gids = gids.filter(gid => groupById[gid].domain === domainFilter);
  const nodes = gids.map(gid => {
    const g = groupById[gid];
    return {
      data:{
        id:'grp-'+gid, label: g.name, kind:'group', group:gid, gname:g.name,
        domain:g.domain, coreCount: g.node_ids.filter(inCore).length,
        totalCount: g.node_ids.length
      }
    };
  });
  let edges = [];
  DATA.groupEdges.forEach(ge => {
    if (domainFilter && (groupById[ge.source].domain !== domainFilter || groupById[ge.target].domain !== domainFilter)) return;
    if (currentView === 'sprint'){
      if (inCore(ge.viaFrom) && inCore(ge.viaTo)) edges.push({ data:{ id:'grp-'+ge.source+'->grp-'+ge.target, source:'grp-'+ge.source, target:'grp-'+ge.target, kind:'group', type:ge.type } });
    } else {
      edges.push({ data:{ id:'grp-'+ge.source+'->grp-'+ge.target, source:'grp-'+ge.source, target:'grp-'+ge.target, kind:'group', type:ge.type } });
    }
  });
  const seen = new Set();
  edges = edges.filter(e => {
    const k = e.data.source+'|'+e.data.target;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  return { nodes, edges };
}

// ===== 组内视图（含跨组 stub）=====
function buildGroupDrill(gid){
  const g = groupById[gid];
  const members = g.node_ids;
  const memberSet = new Set(members);
  const relatedIds = new Set(members);
  const edges = [];
  DATA.edges.forEach(e => {
    if (!edgeVisible(e)) return;
    const s = e.from, t = e.to;
    const sIn = memberSet.has(s), tIn = memberSet.has(t);
    if (sIn && tIn){
      edges.push({ data:{ id:s+'->'+t, source:s, target:t, type:e.type } });
    } else if (sIn || tIn){
      const other = sIn ? t : s;
      if (nodeById[other] && !memberSet.has(other)){ relatedIds.add(other); edges.push({ data:{ id:s+'->'+t, source:s, target:t, type:e.type } }); }
    }
  });
  const nodes = [];
  relatedIds.forEach(id => {
    const n = nodeById[id];
    if (!n) return;
    const isMember = memberSet.has(id);
    nodes.push({
      data:{
        id, label:n.name, kind:'node', group:n.group, gname: groupById[n.group] ? groupById[n.group].name : '',
        stage:n.stage, priority:n.priority, brief:n.brief || '',
        member:isMember, mode: isMember ? 'member' : 'stub'
      }
    });
  });
  nodes.sort((a,b) => {
    const am = a.data.member ? 0 : 1, bm = b.data.member ? 0 : 1;
    if (am !== bm) return am - bm;
    if (a.data.member) return groupNodeIndex[a.data.id] - groupNodeIndex[b.data.id];
    return a.data.id < b.data.id ? -1 : 1;
  });
  return { nodes, edges };
}

// ===== 学习路径视图 =====
function buildLearnView(){
  if (layerMode === 'stage' && currentStage){
    // 下钻：当前 stage 的全部节点 DAG
    const layer = DATA.layers.find(l => l.stage === currentStage);
    if (!layer) return { nodes:[], edges:[] };
    const idSet = new Set(layer.node_ids);
    const nodes = layer.node_ids.map(id => {
      const n = nodeById[id];
      return { data:{ id, label:n.name, kind:'node', group:n.group, gname: groupById[n.group]?groupById[n.group].name:'', stage:n.stage, priority:n.priority, brief:n.brief||'', member:true, mode:'member' } };
    });
    const edges = [];
    DATA.edges.forEach(e => {
      if (idSet.has(e.from) && idSet.has(e.to)) edges.push({ data:{ id:e.from+'->'+e.to, source:e.from, target:e.to, type:e.type } });
    });
    return { nodes, edges };
  }
  if (layerMode === 'stage'){
    const nodes = DATA.layers.map(l => ({
      data:{ id:'layer-'+l.stage, label:'['+STAGE_LABEL[l.stage]+'] '+STAGE_LABEL[l.stage], kind:'layer', stage:l.stage, nodeCount:l.node_ids.length }
    }));
    return { nodes, edges:[] };
  }
  // domain 视角：每个域一个节点
  const nodes = DATA.domains.map(d => ({ data:{ id:'dom-'+d, label:d, kind:'domain', domain:d } }));
  const edges = [];
  const seen = new Set();
  DATA.groupEdges.forEach(ge => {
    const gs = groupById[ge.source], gt = groupById[ge.target];
    if (!gs || !gt || gs.domain === gt.domain) return;
    const key = gs.domain+'|'+gt.domain;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ data:{ id:'dom-'+gs.domain+'->dom-'+gt.domain, source:'dom-'+gs.domain, target:'dom-'+gt.domain, type:ge.type } });
  });
  return { nodes, edges };
}

// ===== 渲染 =====
function render(doFit=true){
  let els, mode;
  if (learnMode){
    els = buildLearnView();
    mode = '学习路径';
  } else if (currentGroup === null){
    els = buildGroupNodes();
    mode = domainFilter ? ('组级 · ' + domainFilter) : '组级';
  } else {
    els = buildGroupDrill(currentGroup);
    mode = currentGroup + ' · ' + (groupById[currentGroup] ? groupById[currentGroup].name : '');
  }
  cy.elements().remove();
  cy.add(els.nodes);
  cy.add(els.edges);
  applyViewStyles();
  applySearchStyles();
  $('zcount').textContent = cy.nodes().length;
  $('zmode').textContent = mode;
  $('zview').textContent = currentView === 'full' ? '完整' : (currentView === 'sprint' ? '冲刺' : '高亮');
  const layoutOpts = (learnMode && layerMode === 'stage' && !currentStage)
    ? { name:'grid', columns:4, rows:1, padding:80 }
    : { name:'dagre', rankDir:'LR', nodeSep:40, rankSep:70, padding:40 };
  cy.layout(layoutOpts).run();
  if (doFit) cy.fit(undefined, 50);
  updateCrumb();
}

// 三视图的样式差异
function applyViewStyles(){
  cy.nodes().forEach(n => {
    const d = n.data();
    let bw = 1, bc = 'rgba(255,255,255,0.35)', op = 1, lw = 1;
    if (d.kind === 'group' || d.kind === 'domain' || d.kind === 'layer') bw = 3;
    if (currentView === 'sprint' && d.kind === 'node' && !inCore(d.id)) op = 0.15;
    if (currentView === 'sprint' && d.kind === 'group' && d.coreCount === 0) op = 0.2;
    if (currentView === 'highlight'){
      if (d.kind === 'node' && d.priority === 'P0'){ bw = 3.5; bc = '#ff3b4d'; }
      else if (d.kind === 'group' && d.coreCount > 0){ bw = 3.5; bc = '#ff3b4d'; }
    }
    if (searchMode && searchTerm){
      const term = searchTerm.toLowerCase();
      const hit = ((d.label||'').toLowerCase().includes(term)) || ((d.id||'').toLowerCase().includes(term));
      if (!hit) op = 0.12;
      else if (d.kind === 'node'){ bw = 3; bc = '#ffd700'; }
    }
    n.style('border-width', bw);
    n.style('border-color', bc);
    n.style('opacity', op);
  });
  // 学习路径 / 组级节点标签
  cy.nodes().forEach(n => {
    const d = n.data();
    if (currentView === 'highlight' && d.kind === 'group'){
      n.style('label', d.gname + '\n(P0:' + d.coreCount + '/' + d.totalCount + ')');
    } else {
      n.style('label', d.label);
    }
  });
}
function applySearchStyles(){ /* handled in applyViewStyles */ }

// ===== 视图切换 =====
// ★ a11y：分段控件是**切换按钮**，按下态必须同时落在 aria-pressed 上（⛔ 不只靠 .active 视觉类）。
function announce(msg){
  const el = $('searchstatus');
  if (el) el.textContent = msg;
}
function syncPressed(segId, active){
  document.querySelectorAll('#'+segId+' button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.view === active));
  });
}
function setView(v){
  currentView = v;
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  syncPressed('viewSeg', v);
  announce('视图已切换为「' + v + '」');
  render();
}
document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

function setLayerMode(m){
  layerMode = m;
  currentStage = null;
  document.querySelectorAll('#layerSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === m));
  syncPressed('layerSeg', m);
  announce('视角已切换为「' + m + '」');
  render();
}
document.querySelectorAll('#layerSeg button').forEach(b => b.addEventListener('click', () => setLayerMode(b.dataset.view)));

function enterLearn(){
  learnMode = true; currentGroup = null; domainFilter = null;
  $('crumb').style.display = 'none'; $('backbtn').style.display = 'none';
  $('layerSeg').style.display = 'inline-flex'; $('viewSeg').style.display = 'none';
  $('searchbox').placeholder = '搜索节点…';
  render();
}
function exitLearn(){
  learnMode = false; currentStage = null;
  $('layerSeg').style.display = 'none'; $('viewSeg').style.display = 'inline-flex';
  render();
}
$('learnbtn').addEventListener('click', () => { if (learnMode) exitLearn(); else enterLearn(); });

  if (currentGroup !== null){
    currentGroup = null; searchMode=false; searchTerm=''; $('searchbox').value='';
    render();
  }
}
$('backbtn').addEventListener('click', goBack);

    }},
    { selector:'node[kind="node"][mode="stub"]', style:{
      'background-color':'#2a2e38','border-width':1,'border-color':'#555a66',
      'width':52,'height':26, opacity:0.55, 'font-size':8
    }},
    { selector:'edge', style:{
      'curve-style':'bezier','target-arrow-shape':'triangle','arrow-scale':0.7,
      'line-color': function(ele){ return EDGE_COLOR[ele.data('type')] || '#4a5265'; },
      'target-arrow-color': function(ele){ return EDGE_COLOR[ele.data('type')] || '#4a5265'; },
      'width':1.3
    }},
    { selector:'edge[type="prerequisite"]', style:{ 'width':2.0 } },
    { selector:'edge[type="variant"]', style:{ 'line-style':'dashed' } },
    { selector:'edge[type="cooccurrence"]', style:{ 'line-style':'dotted' } }
  ],
  layout: { name:'dagre', rankDir:'LR', nodeSep:40, rankSep:70, padding:40 },
  wheelSensitivity: 0.3,
  minZoom: 0.05,
  maxZoom: 5,
});
window.__cy = cy;

// ===== 交互 =====
cy.on('tap', 'node', (evt) => {
  const d = evt.target.data();
  if (learnMode){
    if (d.kind === 'layer'){
      currentStage = d.stage;
      render();
    } else if (d.kind === 'domain'){
      // 进入组级视图并过滤该域
      learnMode = false; currentStage = null; domainFilter = d.domain;
      $('layerSeg').style.display = 'none'; $('viewSeg').style.display = 'inline-flex';
      render();
    } else if (d.kind === 'node'){
      window.location.href = '../02-node-pages/' + d.id + '.html';
    }
    return;
  }
  if (currentGroup === null){
    if (d.kind === 'group'){
      currentGroup = d.group; searchMode=false; searchTerm=''; $('searchbox').value='';
      render();
    }
  } else {
    if (d.kind === 'node'){
      window.location.href = '../02-node-pages/' + d.id + '.html';
    }
  }
});

// ===== 搜索 =====
$('searchbox').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  searchMode = v.length > 0;
  searchTerm = v;
  applyViewStyles();
  if (!searchMode) render(false);
  // 搜索模式下不重建布局，仅高亮
  if (searchMode){
    $('zcount').textContent = cy.nodes(':visible').length;
    announce('搜索「' + v + '」：命中 ' + cy.nodes(':visible').length + ' 个节点');
  } else {
    announce('已清空搜索');
  }
});

// ===== hash 路由 =====
function handleHash(){
  const h = location.hash.replace(/^#/,'');
  if (!h) return;
  if (groupById[h]){
    learnMode = false; currentStage = null; domainFilter = null;
    $('layerSeg').style.display = 'none'; $('viewSeg').style.display = 'inline-flex';
    currentGroup = h;
    render();
  } else if (nodeById[h]){
    const g = nodeToGroup[h];
    if (g){
      learnMode = false; currentStage = null; domainFilter = null;
      $('layerSeg').style.display = 'none'; $('viewSeg').style.display = 'inline-flex';
      currentGroup = g;
      render();
      const el = cy.$('#'+CSS.escape(h));
      if (el.length){
        cy.animate({ fit:{ eles: el, padding: 120 }, duration: 500 });
        el.style('border-width', 4); el.style('border-color', '#ffd700');
      }
    }
  }
}
window.addEventListener('hashchange', handleHash);

// ===== crumb 更新 =====
function updateCrumb(){
  if (currentGroup !== null && !learnMode){
    const g = groupById[currentGroup];
    crumb.style.display = 'inline-flex';
    $('backbtn').style.display = 'inline-block';
    let html = '<b>'+currentGroup+'</b> '+escapeHtml(g ? g.name : '')+' <span style="color:var(--dim)">· '+ (g ? g.node_ids.length : 0) +' 节点</span>';
    if (domainFilter) html += ' <a onclick="clearDomain()">× 清除域过滤</a>';
    crumb.innerHTML = html;
  } else {
    crumb.style.display = 'none';
    $('backbtn').style.display = 'none';
  }
}
window.clearDomain = function(){ domainFilter = null; render(); };
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== 图例 =====
function buildLegend(){
  const lg = $('legend');
  let html = '<b>组节点</b>（'+DATA.groups.length+' 组，彩色，点击下钻）<br>';
  html += '<b>知识节点</b>（'+DATA.nodes.length+' 个，点击跳转节点页）<br>';
  html += '<b>冲刺视图</b>：仅显示 P0+P1 核心节点/边<br>';
  html += '<b>高亮视图</b>：完整图 + P0 红框高亮<br>';
  html += '<b>边类型</b>：<br>';
  Object.keys(EDGE_COLOR).forEach(t => {
    html += '<span class="sw" style="background:'+EDGE_COLOR[t]+'"></span>'+edgeLabel(t)+'<br>';
  });
  html += '<b>阶段</b>：';
  STAGE_ORDER.forEach(s => { html += '<span class="sw" style="background:'+STAGE_COLOR[s]+'"></span>'+STAGE_LABEL[s]+' '; });
  lg.innerHTML = html;
}
function edgeLabel(t){
  return { prerequisite:'前置(prerequisite)', variant:'变体(variant)', combination:'组合(combination)', cooccurrence:'共现(cooccurrence)' }[t] || t;
}

// ===== 组配色图例（点击定位组）=====
const gl = $('glegend');
DATA.groups.forEach(g => {
  const d = document.createElement('div');
  d.className = 'row';
  d.dataset.gid = g.id;
  const sw = document.createElement('span');
  sw.className = 'sw';
  sw.style.background = DATA.groupColor[g.id];
  const txt = document.createElement('span');
  txt.textContent = g.name + ' (' + g.id + ')';
  d.appendChild(sw);
  d.appendChild(txt);
  d.addEventListener('click', () => {
    currentGroup = g.id; searchMode=false; searchTerm=''; $('searchbox').value='';
    learnMode = false; currentStage = null; domainFilter = null;
    $('layerSeg').style.display = 'none'; $('viewSeg').style.display = 'inline-flex';
    render();
  });
  gl.appendChild(d);
});

// ===== 初始渲染 =====
buildLegend();
render();
handleHash();
</script>
</body>
</html>
